name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after 7 days with no API activity.
# This workflow hits the project's REST API every 3 days so it never gets
# there. It talks to Supabase directly, so it works even before this app
# is deployed anywhere.
#
# Setup (one time): in the GitHub repo go to
# Settings -> Secrets and variables -> Actions -> New repository secret,
# and add:
#   SUPABASE_URL         (e.g. https://xxxx.supabase.co)
#   SUPABASE_ANON_KEY     (the anon/public key, NOT the service role key)
# Both values are in .env.local (NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY).

on:
  schedule:
    # 03:00 UTC (~08:30 IST), every 3rd day of the month.
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret." >&2
            exit 1
          fi

          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tenants?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "Keep-alive ping failed" >&2
            exit 1
          fi
